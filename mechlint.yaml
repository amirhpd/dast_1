# mechlint: the facts about this robot that are in neither the CAD nor the URDF.
#
#   mechlint check                 # units, tensors, masses, meshes -- exit 1 if anything fails
#   mechlint inertia               # what every link actually weighs
#   mechlint inertia -w src/description/urdf/   # regenerate inertials.xacro
#
# No ROS shell needed: package_paths below is what $(find ...) and package:// resolve
# through. See https://github.com/amirhpd/mechlint.

robot:
  description: src/description/urdf/description.urdf.xacro
  xacro_args: { is_sim: "true" }
  # `controller` is only here because the Gazebo plugin block says
  # $(find controller)/config/controller.yaml: xacro resolves every $(find) before
  # mechlint sees any XML, even the ones it goes on to ignore.
  package_paths: { description: src/description, controller: src/controller }
  model_scale: 0.1                 # this model is in decimetres -- U001 says so every run

materials:
  default: { material: pla, infill: 0.30 }
  links:
    # base_link used to be weighed at 210 g; that was the old base. Weigh the new
    # base_1 print and put it back as  base_link: { measured_mass_g: <g> }
    # Not printed: a Kinect is a bought part, so PLA density says nothing about it.
    # Its mass is the datasheet figure; the box in the URDF gives the right shape.
    kinect_link: { measured_mass_g: 500 }

components:                        # mass that is not in the meshes
  # Each servo is listed under the link it is bolted to, the parent or the child of the
  # joint it drives.
  #
  # `at: [x, y, z]` is the centre of the servo CASE (not its spline), in the frame of the
  # link it is listed under, in URDF units: decimetres, so millimetres / 100.
  # Measure it in CAD in that part's own axes. None of the links that carry a servo
  # has a rotated mesh in the URDF, so CAD (x, y, z) copies over directly (/100).
  # "on axis" in each comment is where `drives:` alone would put it, for reference.
  base_link:                       # base_1.stl, fixed
    - { actuator: ds3240,      drives: joint_1, at: [0.27, 0, 0.27] }   # parent side; on axis [0, 0, 1.613]
  link_1:
    - { actuator: ds51150_12v, drives: joint_2, at: [0, 0, -0.3] }   # child side;  on axis [0, 0, 0]
  link_2:
    - { actuator: ds51150_12v, drives: joint_3, at: [0, 0, -0.3] }   # child side;  on axis [0, 0, 0]
    - { actuator: mg996r,      drives: joint_4, at: [-0.3, 0, 0.8] }   # parent side; on axis [-0.2725, -0.084, 1.06]
  link_4:                          # carries both wrist servos
    - { actuator: mg996r,      drives: joint_5, at: [0, 0, 0.2] }   # child side;  on axis [0, 0, 0]
    - { actuator: mg996r,      drives: joint_6, at: [-0.25, -0.1, 0] }   # parent side; on axis [-0.025, 0.0175, -0.27]
  # base_2_link, link_3, link_5 and tip_link carry no motor; tip_link is fixed to link_5.

actuators:
  voltage: 6.0                     # default rail: DS3240 and the three MG996R
  joints:
    joint_1: ds3240
    joint_2: { actuator: ds51150_12v, voltage: 12.0 }   # its own 12 V rail
    joint_3: { actuator: ds51150_12v, voltage: 12.0 }
    joint_4: mg996r
    joint_5: mg996r
    joint_6: mg996r

scenario:
  # Only read when a model has no world frame. This one has, so the world-to-base
  # rotation decides which way is down and D002 would flag a disagreement.
  mount: table                     # or ceiling, or an explicit [gx, gy, gz]
  payload_g: 100
  safety_factor: 2.0
